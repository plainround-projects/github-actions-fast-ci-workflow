<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">One push of a code change</title>
<desc id="d">A numbered run across five lanes: Push or pull request, GitHub, Jobs, Cache and ci-ok. The push matches the path filter (1) and joins the concurrency group, which cancels an older run (2). Lint and six test jobs start in parallel (3). The cache key is computed from the system, the Python version and the lock file hash (4), pip installs with hashes verified (5), and pytest writes report.xml and coverage.xml (6). Amber: one combination, Python 3.10, fails on purpose (6x). The reports are uploaded anyway (7). ci-ok reads needs and passes only if every job passed (8).</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">One push of a code change</text>
<text class="caption" x="48" y="100">One push, from the path filter to the single required check. Amber: one combination fails and its reports are kept.</text>
<rect class="actor" x="385" y="128" width="150" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Push or PR</text>
<rect class="svc" x="550" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">GitHub</text>
<rect class="svc" x="710" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">Jobs</text>
<rect class="svc" x="870" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="930" y="158" text-anchor="middle">Cache</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">ci-ok</text>
<path class="hair" d="M460 176V232M610 176V360M770 176V744M930 176V424M1088 176V744"/>
<path class="hair" d="M66 216V728"/>
<circle class="dot" cx="66" cy="216" r="15"/>
<text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Push matches the filter</text>
<text class="sub" x="96" y="232">a file outside docs/** and *.md</text>
<path class="sync" d="M460 216H610"/>
<text class="label t-accent" x="476" y="206">push</text>
<circle class="dot" cx="66" cy="280" r="15"/>
<text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Concurrency group joined</text>
<text class="sub" x="96" y="296">older run of ci-&lt;ref&gt; canceled</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">cancel older</text>
<circle class="dot" cx="66" cy="344" r="15"/>
<text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">lint and 6 tests start</text>
<text class="sub" x="96" y="360">on separate runners, in parallel</text>
<path class="sync" d="M610 344H770"/>
<text class="label t-accent" x="626" y="334">start 7 jobs</text>
<circle class="dot" cx="66" cy="408" r="15"/>
<text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Cache key is computed</text>
<text class="sub" x="96" y="424">OS, Python, hash of the lock file</text>
<path class="sync" d="M770 408H930"/>
<text class="label t-accent" x="786" y="398">lookup</text>
<circle class="dot" cx="66" cy="472" r="15"/>
<text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Install, hashes verified</text>
<text class="sub" x="96" y="488">pip --require-hashes</text>
<rect class="slot" x="764" y="454" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="477">from cache</text>
<circle class="dot" cx="66" cy="536" r="15"/>
<text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">pytest runs, writes reports</text>
<text class="sub" x="96" y="552">report.xml, coverage.xml</text>
<rect class="slot" x="764" y="518" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="541">pytest</text>
<circle class="dot-w" cx="66" cy="600" r="15"/>
<text class="num" x="66" y="605" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="596">One combination fails</text>
<text class="sub" x="96" y="616">make run-fail: Python 3.10</text>
<rect class="slot" x="764" y="582" width="12" height="36" rx="4"/>
<path class="fail" d="M776 600H1088"/>
<text class="label t-warn" x="946" y="590">3.10 red</text>
<circle class="dot" cx="66" cy="664" r="15"/>
<text class="num" x="66" y="669" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="660">Reports uploaded anyway</text>
<text class="sub" x="96" y="680">if: always(), kept 7 days</text>
<rect class="slot" x="764" y="646" width="12" height="36" rx="4"/>
<text class="label t-accent" x="786" y="669">upload</text>
<circle class="dot-g" cx="66" cy="728" r="15"/>
<text class="num" x="66" y="733" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="724">ci-ok reads needs</text>
<text class="sub" x="96" y="744">fails if any job failed</text>
<rect class="slot" x="764" y="710" width="12" height="36" rx="4"/>
<path class="sync" d="M776 728H1088"/>
<text class="label t-accent" x="946" y="718">needs</text>
<path class="ok" d="M764 728H710"/>
<rect class="win" x="430" y="708" width="280" height="40" rx="10"/>
<text class="label b t-good" x="446" y="733">all green: check passes</text>
<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
<path class="fail" d="M696 786H760"/><text class="legend" x="772" y="791">failure path</text>
<path class="ok" d="M928 786H992"/><text class="legend" x="1004" y="791">result</text>
</svg>
