<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="t d">
<title id="t">The fast CI workflow you build</title>
<desc id="d">A push or pull request meets the path filter. A docs-only change goes to ci-docs-only.yml, which reports the ci-ok check as a no-op. A code change starts the lint job and a matrix of three Python versions times two systems, six jobs, each reading the dependency cache, running pytest with coverage, and keeping test reports for seven days even when a job fails, drawn in amber. The ci-ok gate, the one required check, reads lint, the matrix and the docs job. A newer push to the same branch cancels the matrix with cancel-in-progress.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="829" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="828" rx="16"/>
<text class="title" x="48" y="68">The fast CI workflow you build</text>
<text class="caption" x="48" y="100">Six matrix jobs run beside lint, and one gate decides. Amber: reports are kept even when a job fails.</text>
<rect class="actor" x="48" y="320" width="264" height="72" rx="36"/>
<text class="name" x="180" y="352" text-anchor="middle">Push or pull request</text>
<rect class="svc" x="376" y="304" width="200" height="108" rx="12"/>
<text class="name" x="392" y="336">Path filter</text>
<text class="sub" x="392" y="360">docs/** and *.md</text>
<text class="sub" x="392" y="382">are ignored</text>
<rect class="svc" x="688" y="148" width="216" height="92" rx="12"/>
<text class="name" x="704" y="180">ci-docs-only.yml</text>
<text class="sub" x="704" y="204">job ci-ok</text>
<text class="sub" x="704" y="226">a no-op</text>
<rect class="svc" x="688" y="272" width="216" height="116" rx="12"/>
<text class="name" x="704" y="304">lint job</text>
<text class="sub" x="704" y="328">ruff, mypy, pins</text>
<text class="sub" x="704" y="350">import-linter, audit</text>
<text class="sub" x="704" y="372">actionlint</text>
<rect class="svc" x="984" y="272" width="168" height="108" rx="12"/>
<text class="name" x="1000" y="304">ci-ok gate</text>
<text class="sub" x="1000" y="328">required check</text>
<text class="sub" x="1000" y="350">for main</text>
<rect class="boundary" x="376" y="452" width="776" height="204" rx="14"/>
<text class="tag" x="392" y="480">Matrix: 3 versions x 2 systems = 6 jobs</text>
<path class="store" d="M400 496a112 12 0 0 1 224 0v84a112 12 0 0 1 -224 0z"/>
<path class="rim" d="M400 496a112 12 0 0 0 224 0"/>
<text class="name" x="512" y="536" text-anchor="middle">Dependency cache</text>
<text class="sub" x="512" y="558" text-anchor="middle">OS + Python + hash</text>
<text class="sub" x="512" y="580" text-anchor="middle">of requirements.txt</text>
<rect class="svc" x="696" y="504" width="200" height="92" rx="12"/>
<text class="name" x="712" y="536">pytest</text>
<text class="sub" x="712" y="560">with coverage</text>
<path class="store" d="M968 496a80 12 0 0 1 160 0v106a80 12 0 0 1 -160 0z"/>
<path class="rim" d="M968 496a80 12 0 0 0 160 0"/>
<text class="name" x="1048" y="536" text-anchor="middle">Test reports</text>
<text class="sub" x="1048" y="558" text-anchor="middle">report.xml</text>
<text class="sub" x="1048" y="580" text-anchor="middle">coverage.xml</text>
<text class="sub" x="1048" y="602" text-anchor="middle">kept 7 days</text>
<rect class="actor" x="508" y="700" width="264" height="72" rx="36"/>
<text class="name" x="640" y="732" text-anchor="middle">Newer push</text>
<text class="sub" x="640" y="754" text-anchor="middle">same branch</text>
<rect class="note" x="48" y="500" width="280" height="124" rx="10"/>
<text class="label b t-warn" x="64" y="530">make run-fail</text>
<text class="sub" x="64" y="556">3.10 fails on purpose:</text>
<text class="sub" x="64" y="578">the other jobs finish</text>
<text class="sub" x="64" y="600">and upload reports</text>
<path class="sync" d="M312 358H376"/>
<text class="label t-accent" x="324" y="346">push</text>
<path class="sync" d="M476 304V194Q476 182 488 182H688"/>
<text class="label t-accent" x="496" y="170">docs only</text>
<path class="sync" d="M576 340H688"/>
<text class="label t-accent" x="590" y="328">code</text>
<path class="sync" d="M560 412V452"/>
<text class="label t-accent" x="572" y="436">code</text>
<path class="sync" d="M904 330H984"/>
<path class="sync" d="M904 194H1056Q1068 194 1068 206V272"/>
<path class="sync" d="M1068 452V380"/>
<path class="read" d="M624 550H696"/>
<text class="label" x="632" y="538">restore</text>
<path class="fail" d="M896 550H968"/>
<text class="label t-warn" x="904" y="538">always</text>
<path class="async" d="M640 700V656"/>
<text class="label t-accent" x="652" y="684">cancel-in-progress</text>
<path class="sync" d="M48 786H112"/><text class="legend" x="124" y="791">sync call</text>
<path class="async" d="M264 786H328"/><text class="legend" x="340" y="791">async message</text>
<path class="read" d="M520 786H584"/><text class="legend" x="596" y="791">read</text>
<path class="fail" d="M696 786H760"/><text class="legend" x="772" y="791">failure path</text>
</svg>
