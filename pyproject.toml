[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mathkit"
version = "0.1.0"
description = "A tiny math library: the test subject of a fast GitHub Actions CI workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = ["numpy==2.1.3", "pandas==2.2.3"]

[project.scripts]
mathkit = "mathkit.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "pipeline"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "pipeline"]
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

# Test functions are named for the behavior they check; annotating every one adds noise, not safety.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["mathkit", "pipeline"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.importlinter]
root_package = "mathkit"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: interfaces -> infrastructure -> application -> domain, never upward"
type = "layers"
layers = [
    "mathkit.interfaces",
    "mathkit.infrastructure",
    "mathkit.application",
    "mathkit.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application know nothing about pandas or numpy"
type = "forbidden"
source_modules = ["mathkit.domain", "mathkit.application"]
forbidden_modules = ["pandas", "numpy"]
